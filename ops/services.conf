# Services restarted before the market session each weekday.
# One systemd unit name per line. Blank lines and # comments ignored.
#
# Why this exists: Kite Connect access tokens expire daily. A long-running
# process holds a token that silently goes stale, and every API call then
# fails with "Incorrect api_key or access_token" while systemd still reports
# the service as active. On 2026-08-10 spike ran blind from 09:00 to 10:33
# that way -- heartbeats normal, 7787 failed fetches, no alerts possible.
# Restarting before the open forces a fresh login.
#
# Any algorithm on this box with the same daily-token problem can just add
# its unit here.
spike.service
